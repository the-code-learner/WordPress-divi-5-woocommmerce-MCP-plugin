name: Publish v1.1.1 once

on:
  push:
    branches:
      - release/1.1.1
    paths:
      - '.github/workflows/release-v1.1.1-once.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: a2e506c85dabf5f904c671213ad0480da44404e2
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer:v2

      - name: Verify immutable release pin
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "a2e506c85dabf5f904c671213ad0480da44404e2"
          test "$(git rev-parse origin/main)" = "a2e506c85dabf5f904c671213ad0480da44404e2"
          if git ls-remote --exit-code --tags origin refs/tags/v1.1.1 >/dev/null 2>&1; then
            echo "v1.1.1 already exists; refusing to move or replace it."
            exit 1
          fi
          export TAG_VERSION="1.1.1"
          composer run validate-version

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Build production ZIP
        run: ./scripts/build-zip.sh

      - name: Publish pinned stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sha256sum build/mcp-bridge-for-divi-woocommerce.zip
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a v1.1.1 a2e506c85dabf5f904c671213ad0480da44404e2 -m "v1.1.1"
          git push origin refs/tags/v1.1.1
          gh release create v1.1.1 \
            build/mcp-bridge-for-divi-woocommerce.zip \
            --verify-tag \
            --title "v1.1.1" \
            --generate-notes \
            --latest
