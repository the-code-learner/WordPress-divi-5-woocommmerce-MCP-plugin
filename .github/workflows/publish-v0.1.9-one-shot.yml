name: Publish v0.1.9 one-shot

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0.1.9-one-shot.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v0.1.9
      RELEASE_VERSION: 0.1.9
      TARGET_SHA: 73a136827ff1492ecb73fc10c5994558a6faf13b

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout tested release commit
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${TARGET_SHA}^{commit}"
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Guard release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          export TAG_VERSION="$RELEASE_VERSION"
          composer run validate-version

      - name: Build distributable ZIP
        run: ./scripts/build-zip.sh

      - name: Publish GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            build/mcp-bridge-for-divi-woocommerce.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
