name: Runtime bridge PHPCBF autofix

on:
  push:
    branches:
      - feat/generic-divi-runtime-bridge

permissions:
  contents: write

jobs:
  phpcbf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/generic-divi-runtime-bridge

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer:v2

      - name: Install development dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Apply WordPress coding standards autofixes
        shell: bash
        run: |
          vendor/bin/phpcbf --standard=phpcs.xml.dist \
            src/Divi/RuntimeDescriptor.php \
            src/Divi/RuntimeRenderer.php \
            src/Divi/RuntimeBridgeAbilities.php \
            src/Divi/RuntimeRegistryDiscovery.php \
            src/Divi/RuntimeNativeWriter.php \
            tests/Unit/RuntimeNativeWriterTest.php \
            tests/Unit/RuntimeBridgeAbilitiesRegistrationTest.php || test $? -eq 1

      - name: Commit autofixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Divi tests/Unit
          git commit -m "style(divi): apply WordPress coding standards"
          git push origin HEAD:feat/generic-divi-runtime-bridge
