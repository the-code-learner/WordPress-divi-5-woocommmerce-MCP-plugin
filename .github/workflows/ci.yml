name: CI

on:
  push:
    branches:
      - main
      - 'bootstrap/**'
      - 'feature/**'
      - 'release/**'
  pull_request:

permissions:
  contents: read

jobs:
  dependency-integrity:
    name: Dependency Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer:v2

      - name: Require Composer lock
        run: test -f composer.lock

      - name: Validate Composer metadata and lock
        run: composer validate --strict

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify OAuth dependency integrity
        run: composer run validate-oauth-dependency

      - name: Audit locked dependencies
        run: composer audit --locked

      - name: Verify install did not modify lock
        run: git diff --exit-code -- composer.lock

  quality:
    name: PHP, tests, build, Plugin Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer:v2

      - name: Install development dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Version consistency
        run: composer run validate-version

      - name: PHP syntax
        run: composer run lint:syntax

      - name: WordPress coding standards
        run: composer run lint

      - name: Unit tests
        run: composer run test

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Build distributable ZIP
        run: ./scripts/build-zip.sh

      - name: Verify distribution contents
        run: |
          test ! -e build/mcp-bridge-for-divi-woocommerce/.github
          test ! -e build/mcp-bridge-for-divi-woocommerce/tests
          test ! -e build/mcp-bridge-for-divi-woocommerce/node_modules
          test ! -e build/mcp-bridge-for-divi-woocommerce/.phpunit.result.cache
          test ! -e build/mcp-bridge-for-divi-woocommerce/languages/.gitkeep
          test -e build/mcp-bridge-for-divi-woocommerce/vendor
          test -e build/mcp-bridge-for-divi-woocommerce/divi-5-woocommerce-mcp.php
          test -x build/mcp-bridge-for-divi-woocommerce/bin/linux-x86_64/chrome-headless-shell/chrome-headless-shell
          test -f build/mcp-bridge-for-divi-woocommerce/bin/linux-x86_64/chrome-headless-shell/LICENSE.headless_shell
          test "$(cat build/mcp-bridge-for-divi-woocommerce/bin/linux-x86_64/chrome-headless-shell/.bundle-version)" = "152.0.7977.64"

      - name: Bundled Chromium smoke test
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8123 -t tests/fixtures/chromium-site >/tmp/divi-mcp-chromium-http.log 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" >/dev/null 2>&1 || true' EXIT
          sleep 1
          php tests/chromium-smoke.php \
            build/mcp-bridge-for-divi-woocommerce/bin/linux-x86_64/chrome-headless-shell/chrome-headless-shell \
            http://127.0.0.1:8123/

      - name: WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/mcp-bridge-for-divi-woocommerce'
          # Temporary while GitHub Releases are the distribution channel.
          # Re-enable the updater check before building the WordPress.org package.
          exclude-checks: plugin_updater
          categories: |
            general
            plugin_repo
            security

      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: mcp-bridge-for-divi-woocommerce
          path: build/mcp-bridge-for-divi-woocommerce.zip
          if-no-files-found: error
