name: CI

on:
  push:
    branches:
      - main
      - 'bootstrap/**'
      - 'feature/**'
      - 'release/**'
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: PHP, tests, build, Plugin Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install development dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Version consistency
        run: composer run validate-version

      - name: PHP syntax
        run: composer run lint:syntax

      - name: WordPress coding standards
        run: composer run lint

      - name: Unit tests
        run: composer run test

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Build distributable ZIP
        run: ./scripts/build-zip.sh

      - name: Verify distribution contents
        run: |
          test ! -e build/mcp-bridge-for-divi-woocommerce/.github
          test ! -e build/mcp-bridge-for-divi-woocommerce/tests
          test ! -e build/mcp-bridge-for-divi-woocommerce/node_modules
          test ! -e build/mcp-bridge-for-divi-woocommerce/.phpunit.result.cache
          test ! -e build/mcp-bridge-for-divi-woocommerce/languages/.gitkeep
          test -e build/mcp-bridge-for-divi-woocommerce/vendor
          test -e build/mcp-bridge-for-divi-woocommerce/divi-5-woocommerce-mcp.php

      - name: WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/mcp-bridge-for-divi-woocommerce'
          # Temporary while GitHub Releases are the distribution channel.
          # Re-enable the updater check before building the WordPress.org package.
          exclude-checks: plugin_updater
          categories: |
            general
            plugin_repo
            security

      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: mcp-bridge-for-divi-woocommerce
          path: build/mcp-bridge-for-divi-woocommerce.zip
          if-no-files-found: error
