name: Compute Chromium bundle digest once

on:
  push:
    branches:
      - feature/bundled-chromium-screenshot

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned Chrome Headless Shell
        shell: bash
        run: |
          set -euo pipefail
          URL='https://storage.googleapis.com/chrome-for-testing-public/152.0.7977.64/linux64/chrome-headless-shell-linux64.zip'
          curl --fail --location --proto '=https' --tlsv1.2 --output chrome-headless-shell-linux64.zip "$URL"
          sha256sum chrome-headless-shell-linux64.zip
          unzip -l chrome-headless-shell-linux64.zip | head -80
