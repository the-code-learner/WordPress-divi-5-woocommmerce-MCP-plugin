name: Enable immutable releases once

on:
  push:
    branches:
      - release/1.1.0
    paths:
      - '.github/workflows/release-v1.1.0-once.yml'

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable repository release immutability
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api \
            --method PUT \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            repos/the-code-learner/WordPress-divi-5-woocommmerce-MCP-plugin/immutable-releases
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            repos/the-code-learner/WordPress-divi-5-woocommmerce-MCP-plugin/immutable-releases
