name: Bootstrap v0.1.4 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-release-v0.1.4.yml'

permissions:
  contents: write

jobs:
  release:
    name: Create exact tag and GitHub release
    runs-on: ubuntu-latest
    env:
      TAG: v0.1.4
      EXPECTED_SHA: 422c65ec0e39d4591361fdf5b73fbf8d4217ed5d
      ASSET: build/mcp-bridge-for-divi-woocommerce.zip
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: 422c65ec0e39d4591361fdf5b73fbf8d4217ed5d
          fetch-depth: 0

      - name: Guard exact release commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$EXPECTED_SHA^{commit}"

      - name: Create exact lightweight tag idempotently
        shell: bash
        run: |
          set -euo pipefail

          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            existing="$(git rev-list -n 1 "$TAG")"
            test "$existing" = "$EXPECTED_SHA" || {
              echo "Tag $TAG already exists at unexpected SHA: $existing" >&2
              exit 1
            }
          else
            git tag "$TAG" "$EXPECTED_SHA"
            git push origin "refs/tags/$TAG"
          fi

          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          test "$(jq -r '.object.type' <<<"$ref_json")" = "commit"
          test "$(jq -r '.object.sha' <<<"$ref_json")" = "$EXPECTED_SHA"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Validate tag version
        shell: bash
        run: |
          set -euo pipefail
          export TAG_VERSION="${TAG#v}"
          composer run validate-version

      - name: Build distributable ZIP
        run: ./scripts/build-zip.sh

      - name: Publish stable GitHub Release idempotently
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ASSET"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; validating instead of recreating."
          else
            gh release create "$TAG" "$ASSET" \
              --title "$TAG" \
              --generate-notes
          fi

      - name: Verify exact tag and release
        shell: bash
        run: |
          set -euo pipefail

          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          test "$(jq -r '.object.type' <<<"$ref_json")" = "commit"
          test "$(jq -r '.object.sha' <<<"$ref_json")" = "$EXPECTED_SHA"

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$TAG"
          test "$(jq -r '.draft' <<<"$release_json")" = "false"
          test "$(jq -r '.prerelease' <<<"$release_json")" = "false"
          test "$(jq '.assets | length' <<<"$release_json")" -eq 1
          test "$(jq -r '.assets[0].name' <<<"$release_json")" = "mcp-bridge-for-divi-woocommerce.zip"
          test "$(jq -r '.assets[0].state' <<<"$release_json")" = "uploaded"
