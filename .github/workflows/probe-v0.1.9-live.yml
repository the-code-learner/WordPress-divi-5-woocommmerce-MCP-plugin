name: Probe v0.1.9 live OAuth

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/probe-v0.1.9-live.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://mediumturquoise-starling-563163.hostingersite.com
      MCP_URL: https://mediumturquoise-starling-563163.hostingersite.com/wp-json/mcp/mcp-oauth-server

    steps:
      - name: Probe public discovery and unauthenticated MCP initialize
        shell: bash
        run: |
          set -euo pipefail

          probe_get() {
            label="$1"
            url="$2"
            headers="/tmp/${label}.headers"
            body="/tmp/${label}.body"
            status="$(curl --connect-timeout 15 --max-time 30 -sS -D "$headers" -o "$body" -w '%{http_code}' "$url")"
            echo "===== ${label} ====="
            echo "URL: ${url}"
            echo "HTTP: ${status}"
            grep -iE '^(content-type|cache-control|pragma|expires|age|server|x-litespeed-cache|cf-cache-status):' "$headers" || true
            echo "BODY:"
            if jq -e . "$body" >/dev/null 2>&1; then
              jq -c . "$body"
            else
              head -c 2000 "$body"; echo
            fi
            echo
          }

          probe_get authorization_server "${BASE_URL}/.well-known/oauth-authorization-server"
          probe_get protected_resource_root "${BASE_URL}/.well-known/oauth-protected-resource"
          probe_get protected_resource_path "${BASE_URL}/.well-known/oauth-protected-resource/wp-json/mcp/mcp-oauth-server"

          headers=/tmp/mcp_initialize.headers
          body=/tmp/mcp_initialize.body
          status="$(curl --connect-timeout 15 --max-time 30 -sS -D "$headers" -o "$body" -w '%{http_code}' \
            -X POST "$MCP_URL" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"github-live-probe","version":"1"}}}')"

          echo '===== unauthenticated_mcp_initialize ====='
          echo "URL: ${MCP_URL}"
          echo "HTTP: ${status}"
          grep -iE '^(content-type|cache-control|pragma|expires|www-authenticate|server|x-litespeed-cache|cf-cache-status):' "$headers" || true
          echo 'BODY:'
          if jq -e . "$body" >/dev/null 2>&1; then
            jq -c . "$body"
          else
            head -c 2000 "$body"; echo
          fi
